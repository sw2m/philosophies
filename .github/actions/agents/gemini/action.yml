name: "Gemini agent"
description: |
  Invokes gemini-cli with content from the input module
  (directory-backed named inputs at $GITHUB_INPUT_DIR) plus an optional
  inline `prompt`. Returns the agent's response as the `response` step
  output. Mirrors the claude composite so both agents have the same
  invocation contract.

inputs:
  org:
    description: "GitHub org whose members are allowed to invoke this agent."
    required: false
    default: "sw2m"
  actor-override:
    description: "Validate this login against the org instead of the trigger sender."
    required: false
    default: ""
  trust-github-actions-bot:
    description: "When 'true', accepts github-actions[bot] without org-member check."
    required: false
    default: "false"
  prompt:
    description: "Optional inline prompt prepended to the input body."
    required: false
    default: ""
  model:
    description: "Primary gemini model."
    required: false
    default: "gemini-3-pro-preview"
  fallback-model:
    description: "Model to retry with if primary errors."
    required: false
    default: "gemini-2.5-pro"
  api-key:
    description: "GEMINI_API_KEY value (caller passes via secret)."
    required: true

outputs:
  response:
    description: "Agent's stdout as text (multi-line via heredoc)."
    value: ${{ steps.invoke.outputs.response }}

runs:
  using: "composite"
  steps:
    - name: Verify org membership
      uses: ./.github/actions/script/github-deno
      with:
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const org = await import("./.github/scripts/github/org.ts");
          await org.verify({
            api: github,
            core,
            org: "${{ inputs.org }}",
            actor: "${{ inputs.actor-override }}",
            sender: "${{ github.event.sender.login }}" || "${{ github.actor }}",
            bot: "${{ inputs.trust-github-actions-bot }}" === "true",
          });

    - uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Install gemini-cli
      shell: bash
      run: npm install -g @google/gemini-cli@latest

    - name: Invoke gemini
      id: invoke
      uses: ./.github/actions/script/github-deno
      env:
        GEMINI_API_KEY: ${{ inputs.api-key }}
      with:
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const { Gemini } = await import("./.github/scripts/agents/gemini.ts");
          const input = (await import("./.github/scripts/github/input.ts")).default;
          const output = await import("./.github/scripts/github/output.ts");

          // Write inline prompt to the input dir so all content is uniform.
          const prompt = `${{ inputs.prompt }}`;
          if (prompt) await input.set("prompt", prompt);

          // Read every file in input dir (sorted), concatenate as sections.
          const parts: string[] = [];
          for (const name of await input.list()) {
            const content = await input.get(name);
            if (content) parts.push(content);
          }
          if (!parts.length) {
            core.setFailed("No content to send to gemini (no input files).");
            return;
          }
          const body = parts.join("\n\n");
          console.log(`input bytes: ${body.length}`);

          const gemini = new Gemini({
            primary: "${{ inputs.model }}",
            fallback: "${{ inputs.fallback-model }}",
          });
          const r = await gemini.run(new Blob([body]).stream());
          const response = new TextDecoder().decode(r.output);
          await output.set("response", response);
          if (r.rc !== 0) {
            core.setFailed(`Gemini exited ${r.rc} on both primary and fallback.`);
            console.log("--- stdout ---");
            console.log(response.slice(0, 2000));
            Deno.exit(r.rc);
          }
          console.log("stdout (first 500 chars):");
          console.log(response.slice(0, 500));

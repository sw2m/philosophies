name: "Gemini agent"
description: |
  Invokes gemini-cli. Reads content from $GITHUB_SHARED_DIR.
  Returns response as `response` step output.


outputs:
  response:
    value: "${{ steps.invoke.outputs.response }}"

runs:
  using: composite
  steps:
    - uses: sw2m/octoscript/action@main

    - name: Verify org membership
      env:
      run: |
        const org = await import("./.github/scripts/github/org.ts");
        await org.verify({
          api: github, core,
          org: "${{ env.INPUT_ORG }}",
          actor: "${{ env.INPUT_ACTOR_OVERRIDE }}",
          sender: "${{ github.event.sender.login }}" || "${{ github.actor }}",
          bot: "${{ env.INPUT_TRUST_GITHUB_ACTIONS_BOT }}" === "true",
        });
      shell: octoscript {0}

    - uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Install gemini-cli
      shell: bash
      run: npm install -g @google/gemini-cli@latest

    - name: Stage prompt input
      if: ${{ inputs.prompt != '' }}
      shell: bash
      run: |
        mkdir -p "${GITHUB_SHARED_DIR:-${RUNNER_TEMP}/shared}"
        printf '%s' "${{ env.INPUT_PROMPT }}" > "${GITHUB_SHARED_DIR:-${RUNNER_TEMP}/shared}/prompt"

    - name: Invoke gemini
      id: invoke
      env:
      run: |
        const { Gemini } = await import("./.github/scripts/agents/gemini.ts");
        const parts = [];
        for (const name of await shared.list()) {
          const content = await shared.get(name);
          if (content) parts.push(content);
        }
        if (!parts.length) { core.setFailed("No content to send to gemini."); return; }
        const body = parts.join("\n\n");
        console.log(`input bytes: ${body.length}`);
        const gemini = new Gemini({
          primary: "${{ env.INPUT_MODEL }}",
          fallback: "${{ env.INPUT_FALLBACK_MODEL }}",
        });
        const r = await gemini.run(new Blob([body]).stream());
        const response = new TextDecoder().decode(r.output);
        await output.set("response", response);
        if (r.rc !== 0) {
          core.setFailed(`Gemini exited ${r.rc} on both primary and fallback.`);
          console.log(response.slice(0, 2000));
          Deno.exit(r.rc);
        }
        console.log("stdout (first 500 chars):");
        console.log(response.slice(0, 500));
      shell: octoscript {0}

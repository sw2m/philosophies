name: "Claude agent"
description: |
  Invokes Claude Code CLI. Reads content from $GITHUB_SHARED_DIR.
  Returns response as `response` step output.


outputs:
  response:
    value: "${{ steps.invoke.outputs.response }}"

runs:
  using: composite
  steps:
    - uses: sw2m/octoscript/action@main

    - name: Verify org membership
      uses: ./.github/actions/github/org/verify
      env:
        INPUT_ACTOR_OVERRIDE: ${{ env.INPUT_ACTOR_OVERRIDE }}
        INPUT_SENDER: ${{ github.event.sender.login }}
        INPUT_ORG: ${{ env.INPUT_ORG }}
        INPUT_TRUST_GITHUB_ACTIONS_BOT: ${{ env.INPUT_TRUST_GITHUB_ACTIONS_BOT }}



    - name: Invoke claude
      id: invoke
      env:
        ANTHROPIC_API_KEY: ${{ env.INPUT_API_KEY }}
      run: |
        const { Claude } = await import("./.github/scripts/agents/claude.ts");
        const parts = [];
        const prompt = inputs.get("prompt") || await shared.get("agent", "prompt");
        if (prompt && prompt.trim()) parts.push(prompt);
        const ctx = await shared.get("agent", "context");
        if (ctx && ctx.trim()) parts.push(ctx);
        if (!parts.length) { core.setFailed("No content to send to claude."); return; }
        const body = parts.join("\n\n");
        console.log(`input bytes: ${body.length}`);
        const claude = new Claude({
          primary: inputs.get("model"),
          fallback: inputs.get("fallback-model"),
          tools: inputs.get("allowed-tools"),
          mode: inputs.get("permission-mode"),
        });
        const r = await claude.run(new Blob([body]).stream());
        const response = new TextDecoder().decode(r.output);
        await output.set("response", response);
        if (r.rc !== 0) {
          core.setFailed(`Claude exited ${r.rc} on both primary and fallback.`);
          console.log(response.slice(0, 2000));
          Deno.exit(r.rc);
        }
        console.log("stdout (first 500 chars):");
        console.log(response.slice(0, 500));
      shell: octoscript {0}

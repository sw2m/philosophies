name: "Claude agent"
description: |
  Invokes the Claude Code CLI with content from the input module
  (directory-backed named inputs at $GITHUB_INPUT_DIR) plus an optional
  inline `prompt`. Returns the agent's response as the `response` step
  output. Mirrors the gemini composite so both agents have the same
  invocation contract.

inputs:
  org:
    description: "GitHub org whose members are allowed to invoke this agent."
    required: false
    default: "sw2m"
  actor-override:
    description: "Validate this login against the org instead of the trigger sender."
    required: false
    default: ""
  trust-github-actions-bot:
    description: "When 'true', accepts github-actions[bot] without org-member check."
    required: false
    default: "false"
  prompt:
    description: "Optional inline prompt prepended to the input body."
    required: false
    default: ""
  model:
    description: "Primary Claude model id."
    required: false
    default: "claude-opus-4-5"
  fallback-model:
    description: "Model to retry with if primary errors."
    required: false
    default: "claude-sonnet-4-5"
  api-key:
    description: "ANTHROPIC_API_KEY value (caller passes via secret)."
    required: true
  allowed-tools:
    description: "Space-separated list of tools claude may invoke. Empty = inference-only."
    required: false
    default: ""
  permission-mode:
    description: "Permission mode flag (e.g. bypassPermissions). Empty = omit."
    required: false
    default: ""

outputs:
  response:
    description: "Agent's stdout as text (multi-line via heredoc)."
    value: ${{ steps.invoke.outputs.response }}

runs:
  using: "composite"
  steps:
    - name: Verify org membership
      uses: ./.github/actions/script/github-deno
      with:
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const org = await import("./.github/scripts/github/org.ts");
          await org.verify({
            api: github,
            core,
            org: "${{ inputs.org }}",
            actor: "${{ inputs.actor-override }}",
            sender: "${{ github.event.sender.login }}" || "${{ github.actor }}",
            bot: "${{ inputs.trust-github-actions-bot }}" === "true",
          });

    - uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Install Claude Code CLI
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@latest

    - name: Stage prompt input
      if: ${{ inputs.prompt != '' }}
      shell: bash
      run: |
        mkdir -p "${GITHUB_INPUT_DIR:-${RUNNER_TEMP}/input}"
        printf '%s' "${{ inputs.prompt }}" > "${GITHUB_INPUT_DIR:-${RUNNER_TEMP}/input}/prompt"

    - name: Invoke claude
      id: invoke
      uses: ./.github/actions/script/github-deno
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      with:
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const { Claude } = await import("./.github/scripts/agents/claude.ts");
          const input = await import("./.github/scripts/github/input.ts");
          const output = await import("./.github/scripts/github/output.ts");

          // Read every file in input dir (sorted), concatenate as sections.
          // Prompt (if provided) is already staged as a file by a prior step.
          const parts: string[] = [];
          for (const name of await input.list()) {
            const content = await input.get(name);
            if (content) parts.push(content);
          }
          if (!parts.length) {
            core.setFailed("No content to send to claude (no input files).");
            return;
          }
          const body = parts.join("\n\n");
          console.log(`input bytes: ${body.length}`);

          const claude = new Claude({
            primary: "${{ inputs.model }}",
            fallback: "${{ inputs.fallback-model }}",
            tools: `${{ inputs.allowed-tools }}`,
            mode: "${{ inputs.permission-mode }}",
          });
          const r = await claude.run(new Blob([body]).stream());
          const response = new TextDecoder().decode(r.output);
          await output.set("response", response);
          if (r.rc !== 0) {
            core.setFailed(`Claude exited ${r.rc} on both primary and fallback.`);
            console.log("--- stdout ---");
            console.log(response.slice(0, 2000));
            Deno.exit(r.rc);
          }
          console.log("stdout (first 500 chars):");
          console.log(response.slice(0, 500));

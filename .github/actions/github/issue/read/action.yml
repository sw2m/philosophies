name: "Read issue"
description: "Fetch an issue and write its fields to the shared module."
outputs:
  title: { value: "${{ steps.read.outputs.title}} " }
  body: { value: "${{ steps.read.outputs.body}} " }
  url: { value: "${{ steps.read.outputs.url}} " }
  number: { value: "${{ steps.read.outputs.number}} " }
runs:
  using: composite
  steps:
    - uses: sw2m/octoscript/action@main
    - id: read
      env:
      run: |
        const { Issue } = await import("./.github/scripts/github/issue.ts");
        const ns = "${{ env.INPUT_PREFIX }}" || "issue";
        const { owner, repo } = context.repo;
        const issue = new Issue({ api: github, owner, repo });
        await issue.get({ issue_number: ${{ env.INPUT_ISSUE_NUMBER }} });
        await shared.set(ns, "title", issue.title);
        await shared.set(ns, "body", issue.body ?? "");
        await shared.set(ns, "url", issue.html_url);
        await output.set("title", issue.title);
        await output.set("body", issue.body ?? "");
        await output.set("url", issue.html_url);
        await output.set("number", issue.number);
        console.log(`${ns}.title: ${issue.title}`);
      shell: octoscript {0}

name: "Create issue"
description: "Open an issue via the Issue class."
outputs:
  number: { value: "${{ steps.create.outputs.number}} " }
  url: { value: "${{ steps.create.outputs.url}} " }
  title: { value: "${{ steps.create.outputs.title}} " }
runs:
  using: composite
  steps:
    - uses: sw2m/octoscript/action@main
    - id: create
      run: |
        const { Issue } = await import("./.github/scripts/github/issue.ts");
        const { owner, repo } = context.repo;
        const issue = new Issue({ api: github, owner, repo });
        const labels = inputs.get("labels").split(",").map(s => s.trim()).filter(Boolean);
        try {
          await issue.create({ title: inputs.get("title")`, body: inputs.get("body")`, labels: labels.length ? labels : undefined });
        } catch {
          await issue.create({ title: inputs.get("title")`, body: inputs.get("body")` });
        }
        const ns = inputs.get("prefix") || "issue";
        await shared.set(ns, "title", issue.title);
        await shared.set(ns, "url", issue.html_url);
        await output.set("number", issue.number);
        await output.set("url", issue.html_url);
        await output.set("title", issue.title);
        console.log(`opened: ${issue.html_url}`);
      shell: octoscript {0}

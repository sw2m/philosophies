name: "Create or reuse draft PR"
description: "Scaffold a branch + open a draft PR (or reuse existing). Idempotent."
inputs:
  github-token: { required: true }
  issue-number: { required: true, description: "Issue this PR closes." }
  base-branch: { required: false, default: "main" }
  branch-prefix: { required: false, default: "feat/issue-" }
  title: { required: true }
  body: { required: false, default: "" }
  bot-name: { required: false, default: "promote[bot]" }
  bot-email: { required: false, default: "promote@users.noreply.github.com" }
outputs:
  branch: { value: "${{ steps.scaffold.outputs.branch }}" }
  pr-number: { value: "${{ steps.scaffold.outputs.pr-number }}" }
  created: { value: "${{ steps.scaffold.outputs.created }}", description: "true if new PR was opened" }
runs:
  using: composite
  steps:
    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "${{ inputs.bot-name }}"
        git config user.email "${{ inputs.bot-email }}"

    - id: scaffold
      uses: ./.github/actions/script/github-deno
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { Pull } = await import("./.github/scripts/github/pr.ts");
          const output = await import("./.github/scripts/github/output.ts");
          const { owner, repo } = context.repo;
          const issue = ${{ inputs.issue-number }};
          const base = "${{ inputs.base-branch }}";
          const branch = "${{ inputs.branch-prefix }}" + issue + "-promote";

          await git.fetch("origin", base);
          const branches = await git.branch(["-r"]);
          if (branches.all.includes(`origin/${branch}`)) {
            await git.fetch("origin", branch);
            await git.checkout(branch);
            console.log(`Branch ${branch} already existed; resuming.`);
          } else {
            await git.checkoutBranch(branch, `origin/${base}`);
            await git.commit(
              `chore(promote): scaffold for #${issue}\n\nOwner: @${{ inputs.bot-name }}\nStarted: ${new Date().toISOString()}`,
              { "--allow-empty": null },
            );
            await git.push(["-u", "origin", branch]);
          }
          await output.set("branch", branch);

          const pull = new Pull({ api: github, owner, repo });
          const found = await pull.find({ head: branch });
          if (found) {
            await output.set("pr-number", pull.number);
            await output.set("created", "false");
            console.log(`Reusing existing PR #${pull.number}`);
          } else {
            const body = `${{ inputs.body }}` || `Closes #${issue}`;
            await pull.create({
              head: branch, base,
              title: `${{ inputs.title }}`.trim(),
              body, draft: true,
            });
            await output.set("pr-number", pull.number);
            await output.set("created", "true");
            console.log(`Opened draft PR #${pull.number}: ${pull.html_url}`);
          }

name: "Promote tech-spec to draft PR (5-phase pipeline)"
description: |
  Implements a tech-spec issue end-to-end via a 5-phase pipeline mapped
  to MEMORY.md §VIII (Regression Sets and the 4-Result Rule):

    Phase 1 — Scaffold     (CI: branch + draft PR with spec embedded)
    Phase 2 — Author tests (agent writes new tests, declares regression set)
    Phase 3 — Red gate     (CI runs tests, expects new=red + regression=green)
                            mismatch → loop to Phase 2 (max 3 retries)
    Phase 4 — Implement    (agent writes code)
    Phase 5 — Green gate   (CI runs tests, expects new=green + regression=green)
                            mismatch → loop to Phase 4 (max 3 retries)

  On exhaustion of either retry budget the action labels the issue
  `needs-human` and comments with the last test output. The PR stays
  draft — a human takes over from there.

  Repos with no detectable test runner (docs repos, e.g. sw2m/philosophies)
  follow the §VIII N/A path: Phases 2/3/5 are skipped and Phase 4 runs
  once. The draft PR is the artifact for human review.

inputs:
  issue-number:
    description: "Tech-spec issue to implement."
    required: true
  owner-login:
    description: "Org-member login that took ownership by self-assigning."
    required: true
  anthropic-api-key:
    description: "ANTHROPIC_API_KEY value."
    required: true
  github-token:
    description: "Token used to read/edit the issue, push branch, open PR."
    required: true
  base-branch:
    description: "Branch to fork the implementation branch from."
    required: false
    default: "main"
  max-retries:
    description: "Max retries per gate (Red, Green). 3 = up to 4 attempts each."
    required: false
    default: "3"
  agent-timeout-seconds:
    description: "Wall-clock timeout for each Claude Code CLI invocation. Hard cap that prevents indefinite hangs (e.g. an in-flight API call that never returns); on timeout the primary call is treated as failed and the fallback model retries. 900s = 15 min."
    required: false
    default: "900"

runs:
  using: "composite"
  steps:
    - name: Verify org membership of the owner
      uses: ./.github/actions/script/github-deno
      with:
        github-token: ${{ inputs.github-token }}
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const org = await import("./.github/scripts/github/org.ts");
          await org.verify({
            api: github,
            core,
            sender: "${{ inputs.owner-login }}",
          });

    - name: Read tech-spec issue
      uses: ./.github/actions/script/github-deno
      with:
        github-token: ${{ inputs.github-token }}
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const input = await import("./.github/scripts/github/shared.ts");
          const { owner, repo } = context.repo;
          const issue = await github.rest.issues.get({
            owner, repo, issue_number: ${{ inputs.issue-number }},
          });
          await input.set("tech-title", issue.data.title);
          await input.set("tech-body", issue.data.body ?? "");
          await input.set("tech-url", issue.data.html_url);
          console.log(`tech-spec: ${issue.data.title}`);

    - name: Detect test runner
      id: runner
      uses: ./.github/actions/script/github-deno
      with:
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const runner = await import("./.github/scripts/github/runner.ts");
          const output = await import("./.github/scripts/github/output.ts");
          const cmd = await runner.detect();
          await output.set("default-cmd", cmd ?? "");
          if (!cmd) {
            await output.set("no-runner", "true");
            core.notice("No test runner detected. §VIII (4-Result Rule) is N/A; Phases 2/3/5 will be skipped.");
          } else {
            await output.set("no-runner", "false");
            console.log(`Detected test command: ${cmd}`);
          }

    - name: Configure git
      shell: bash
      run: |
        git config user.name "promote-tech-to-pr[bot]"
        git config user.email "promote-tech-to-pr@users.noreply.github.com"

    - name: Phase 1 — Scaffold (branch + draft PR)
      id: scaffold
      uses: ./.github/actions/script/github-deno
      with:
        github-token: ${{ inputs.github-token }}
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const Mustache = (await import("npm:mustache@^4")).default;
          const output = await import("./.github/scripts/github/output.ts");
          const issue = ${{ inputs.issue-number }};
          const owner = "${{ inputs.owner-login }}";
          const base = "${{ inputs.base-branch }}";
          const branch = `feat/issue-${issue}-promote`;
          const { owner: repoOwner, repo } = context.repo;

          // Idempotent branch: reuse if exists, else create + empty scaffold commit.
          await git.fetch("origin", base);
          const branches = await git.branch(["-r"]);
          if (branches.all.includes(`origin/${branch}`)) {
            await git.fetch("origin", branch);
            await git.checkout(branch);
            console.log(`Branch ${branch} already existed; resuming.`);
          } else {
            await git.checkoutBranch(branch, `origin/${base}`);
            await git.commit(
              `chore(promote): scaffold for #${issue}\n\nPromotion run for issue #${issue}\nOwner: @${owner}\nStarted: ${new Date().toISOString()}`,
              { "--allow-empty": null },
            );
            await git.push(["-u", "origin", branch]);
          }
          await output.set("branch", branch);

          // Open or reuse draft PR.
          const { Pull } = await import("./.github/scripts/github/pr.ts");
          const shared = await import("./.github/scripts/github/shared.ts");
          const pull = new Pull({ api: github, owner: repoOwner, repo });
          const found = await pull.find({ head: branch });
          if (found) {
            await output.set("pr-number", pull.number);
            console.log(`Reusing existing PR #${pull.number}`);
          } else {
            const title = await shared.get("tech-title") ?? "";
            const techBody = await shared.get("tech-body") ?? "";
            const body = await template(
              new URL("./scripts/vsdd/promote/to-pr/scaffold.mustache", `file://${Deno.cwd()}/.github/`),
              { issue, owner, body: techBody },
            );
            await pull.create({ head: branch, base, title: title.trim(), body, draft: true });
            await output.set("pr-number", pull.number);
            console.log(`Opened draft PR #${pull.number}: ${pull.html_url}`);
          }
    - uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Install Claude Code CLI
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@latest

    - name: Phases 2-3 — Author tests + Red gate (with retry)
      id: red-gate
      if: ${{ steps.runner.outputs.no-runner == 'false' }}
      uses: ./.github/actions/script/github-deno
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BRANCH: ${{ steps.scaffold.outputs.branch }}
        PR_NUMBER: ${{ steps.scaffold.outputs.pr-number }}
        DEFAULT_TEST_CMD: ${{ steps.runner.outputs.default-cmd }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        AGENT_TIMEOUT_SECONDS: ${{ inputs.agent-timeout-seconds }}
      with:
        workspace: ${{ github.action_path }}/../..
        script: |
          const gates = await import("./scripts/vsdd/promote/to-pr/gates.ts");
          await gates.red();
    - name: Bail on Red-gate exhaustion
      if: ${{ steps.runner.outputs.no-runner == 'false' && steps.red-gate.outputs.bailed == 'true' }}
      uses: ./.github/actions/script/github-deno
      with:
        github-token: ${{ inputs.github-token }}
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const bail = await import("./.github/scripts/vsdd/promote/to-pr/bail.ts");
          const detail = await Deno.readTextFile(`${Deno.env.get("RUNNER_TEMP")}/red-bail.md`).catch(() => "");
          await bail.run({
            api: github, core,
            gate: "red",
            issue: ${{ inputs.issue-number }},
            pr: ${{ steps.scaffold.outputs.pr-number }},
            owner: "${{ inputs.owner-login }}",
            detail,
            repo: context.repo,
          });
    - name: Phases 4-5 — Implement + Green gate (with retry)
      id: green-gate
      if: ${{ steps.red-gate.outputs.bailed != 'true' }}
      uses: ./.github/actions/script/github-deno
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BRANCH: ${{ steps.scaffold.outputs.branch }}
        PR_NUMBER: ${{ steps.scaffold.outputs.pr-number }}
        NO_RUNNER: ${{ steps.runner.outputs.no-runner }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        AGENT_TIMEOUT_SECONDS: ${{ inputs.agent-timeout-seconds }}
      with:
        workspace: ${{ github.action_path }}/../..
        script: |
          const gates = await import("./scripts/vsdd/promote/to-pr/gates.ts");
          await gates.green();
    - name: Bail on Green-gate exhaustion
      if: ${{ steps.green-gate.outputs.bailed == 'true' }}
      uses: ./.github/actions/script/github-deno
      with:
        github-token: ${{ inputs.github-token }}
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const bail = await import("./.github/scripts/vsdd/promote/to-pr/bail.ts");
          const detail = await Deno.readTextFile(`${Deno.env.get("RUNNER_TEMP")}/green-bail.md`).catch(() => "");
          await bail.run({
            api: github, core,
            gate: "green",
            issue: ${{ inputs.issue-number }},
            pr: ${{ steps.scaffold.outputs.pr-number }},
            owner: "${{ inputs.owner-login }}",
            detail,
            repo: context.repo,
          });
    - name: Final summary comment on success
      if: ${{ steps.green-gate.outputs.bailed == 'false' }}
      uses: ./.github/actions/script/github-deno
      with:
        github-token: ${{ inputs.github-token }}
        workspace: ${{ github.action_path }}/../../../..
        script: |
          const Mustache = (await import("npm:mustache@^4")).default;
          const template = await Deno.readTextFile(
            new URL("./success.mustache", `file://${Deno.env.get("GITHUB_ACTION_PATH")}/../../scripts/vsdd/promote/to-pr/`).href
          );
          const pr = ${{ steps.scaffold.outputs.pr-number }};
          const issue = ${{ inputs.issue-number }};
          const runner = "${{ steps.runner.outputs.no-runner }}" !== "true";
          const body = Mustache.render(template, { pr, runner });
          const { owner, repo } = context.repo;
          await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
          await github.rest.issues.createComment({ owner, repo, issue_number: issue, body });

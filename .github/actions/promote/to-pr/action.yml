name: "Promote tech-spec to draft PR (5-phase pipeline)"
description: |
  5-phase pipeline: scaffold → author tests → Red gate → implement → Green gate.
  On exhaustion, labels `needs-human` and bails. No-runner repos skip §VIII.


runs:
  using: composite
  steps:
    - uses: sw2m/octoscript/action@main

    - name: Verify org membership
      uses: ./.github/actions/github/org/verify
      env:
        INPUT_SENDER: ${{ env.INPUT_OWNER_LOGIN }}

    - name: Read tech-spec issue
      id: read
      uses: ./.github/actions/github/issue/read
      env:
        INPUT_PREFIX: tech

    - name: Build PR body
      id: pr-body
      env:
      run: |
        const techBody = await shared.get("tech", "body") ?? "";
        const body = await template(
          new URL("./.github/scripts/vsdd/promote/to-pr/scaffold.mustache", `file://${Deno.cwd()}/`),
          { issue: ${{ env.INPUT_ISSUE_NUMBER }}, owner: "${{ env.INPUT_OWNER_LOGIN }}", body: techBody },
        );
        await output.set("body", body);
      shell: octoscript {0}

    - name: Phase 1 — Scaffold
      id: scaffold
      uses: ./.github/actions/github/pr/create
      env:
        INPUT_TITLE: ${{ steps.read.outputs.title }}
        INPUT_BODY: ${{ steps.pr-body.outputs.body }}
        INPUT_BOT_NAME: promote-tech-to-pr[bot]
        INPUT_BOT_EMAIL: promote-tech-to-pr@users.noreply.github.com

    - name: Detect test runner
      id: runner
      env:
      run: |
        const runner = await import("./.github/scripts/github/runner.ts");
        const cmd = await runner.detect();
        await output.set("default-cmd", cmd ?? "");
        if (!cmd) {
          await output.set("no-runner", "true");
          core.notice("No test runner detected. §VIII N/A.");
        } else {
          await output.set("no-runner", "false");
          console.log(`Detected: ${cmd}`);
        }
      shell: octoscript {0}


    - name: Red gate
      id: red-gate
      if: ${{ steps.runner.outputs.no-runner == 'false' }}
      uses: ./.github/actions/gates/red
      env:
        INPUT_BRANCH: ${{ steps.scaffold.outputs.branch }}
        INPUT_PR_NUMBER: ${{ steps.scaffold.outputs.pr-number }}
        INPUT_DEFAULT_TEST_CMD: ${{ steps.runner.outputs.default-cmd }}

    - name: Bail on Red-gate exhaustion
      if: ${{ steps.runner.outputs.no-runner == 'false' && steps.red-gate.outputs.bailed == 'true' }}
      env:
      run: |
        const bail = await import("./.github/scripts/vsdd/promote/to-pr/bail.ts");
        await bail.run({
          api: github, core, gate: "red",
          issue: ${{ env.INPUT_ISSUE_NUMBER }},
          pr: ${{ steps.scaffold.outputs.pr-number }},
          owner: "${{ env.INPUT_OWNER_LOGIN }}",
          detail: "${{ steps.red-gate.outputs.bail }}",
          repo: context.repo,
        });
      shell: octoscript {0}

    - name: Green gate
      id: green-gate
      if: ${{ steps.red-gate.outputs.bailed != 'true' }}
      uses: ./.github/actions/gates/green
      env:
        INPUT_BRANCH: ${{ steps.scaffold.outputs.branch }}
        INPUT_PR_NUMBER: ${{ steps.scaffold.outputs.pr-number }}
        INPUT_NO_RUNNER: ${{ steps.runner.outputs.no-runner }}

    - name: Bail on Green-gate exhaustion
      if: ${{ steps.green-gate.outputs.bailed == 'true' }}
      env:
      run: |
        const bail = await import("./.github/scripts/vsdd/promote/to-pr/bail.ts");
        await bail.run({
          api: github, core, gate: "green",
          issue: ${{ env.INPUT_ISSUE_NUMBER }},
          pr: ${{ steps.scaffold.outputs.pr-number }},
          owner: "${{ env.INPUT_OWNER_LOGIN }}",
          detail: "${{ steps.green-gate.outputs.bail }}",
          repo: context.repo,
        });
      shell: octoscript {0}

    - name: Summary on success
      if: ${{ steps.green-gate.outputs.bailed == 'false' }}
      env:
      run: |
        const pr = ${{ steps.scaffold.outputs.pr-number }};
        const issue = ${{ env.INPUT_ISSUE_NUMBER }};
        const hasRunner = "${{ steps.runner.outputs.no-runner }}" !== "true";
        const body = await template(
          new URL("./.github/scripts/vsdd/promote/to-pr/success.mustache", `file://${Deno.cwd()}/`),
          { pr, runner: hasRunner },
        );
        const { owner, repo } = context.repo;
        await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
        await github.rest.issues.createComment({ owner, repo, issue_number: issue, body });
      shell: octoscript {0}

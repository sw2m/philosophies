name: "Red gate (Phase 2-3)"
description: "Author tests + Red gate with retry. New tests must fail; regression must pass."
inputs:
  anthropic-api-key: { required: true }
  github-token: { required: true }
  issue-number: { required: true }
  branch: { required: true }
  pr-number: { required: true }
  default-test-cmd: { required: false, default: "" }
  max-retries: { required: false, default: "3" }
  agent-timeout-seconds: { required: false, default: "900" }
outputs:
  bailed: { value: "${{ steps.run.outputs.bailed }}", description: "true if retries exhausted" }
  bail: { value: "${{ steps.run.outputs.bail }}", description: "Diagnostic detail on bail (multiline)" }
runs:
  using: composite
  steps:
    - id: run
      uses: ./.github/actions/script/github-deno
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BRANCH: ${{ inputs.branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        DEFAULT_TEST_CMD: ${{ inputs.default-test-cmd }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        AGENT_TIMEOUT_SECONDS: ${{ inputs.agent-timeout-seconds }}
      with:
        workspace: ${{ github.action_path }}/../../..
        script: (await import("./scripts/vsdd/promote/to-pr/gates.ts")).red();

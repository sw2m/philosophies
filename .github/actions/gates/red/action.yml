name: "Red gate"
description: "Author tests + Red gate with retry."
outputs:
  bailed: { value: "${{ steps.run.outputs.bailed }}" }
  bail: { value: "${{ steps.run.outputs.bail }}" }
runs:
  using: composite
  steps:
    - uses: sw2m/octoscript/action@main
    - id: run
      run: (await import("./scripts/vsdd/promote/to-pr/gates.ts")).red();
      shell: octoscript {0}

name: VSDD CI Meta-Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/**"
      - "MEMORY.md"
  workflow_call:
    inputs:
      memory_md_repo:
        description: "Repo to fetch MEMORY.md from. Defaults to sw2m/philosophies."
        type: string
        required: false
        default: "sw2m/philosophies"
      memory_md_ref:
        description: "Branch/tag/SHA on memory_md_repo. Defaults to main."
        type: string
        required: false
        default: "main"
    secrets:
      GEMINI_API_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  repo-shape:
    name: Detect repo shape (code vs docs)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      has-tests: ${{ steps.shape.outputs.has-tests }}
      repo-kind: ${{ steps.shape.outputs.repo-kind }}
    steps:
      - uses: actions/checkout@v6
      - id: shape
        uses: ./.github/actions/git/repo-shape

  prep:
    name: Prepare evaluation input
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    needs: [repo-shape]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch canonical MEMORY.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f MEMORY.md ] && [ "${{ inputs.memory_md_repo || 'sw2m/philosophies' }}" = "${{ github.repository }}" ]; then
            cp MEMORY.md memory-canonical.md
          else
            gh api \
              "repos/${{ inputs.memory_md_repo || 'sw2m/philosophies' }}/contents/MEMORY.md?ref=${{ inputs.memory_md_ref || 'main' }}" \
              --jq '.content' | base64 -d > memory-canonical.md
          fi
          wc -l memory-canonical.md

      - uses: sw2m/octoscript/action@main

      - name: Upload eval context
        uses: sw2m/octoscript@main
        with:
          script: |
            const memory = await Deno.readTextFile("memory-canonical.md");
            const { stdout } = await shell("find .github -type f | sort");
            const paths = new TextDecoder().decode(stdout).trim().split("\n");
            const parts = ["<vsdd-canonical>\n" + memory + "\n</vsdd-canonical>", ""];
            for (const p of paths) {
              const content = await Deno.readTextFile(p);
              parts.push("<file path=\"" + p + "\">\n" + content + "\n</file>");
            }
            const evalInput = parts.join("\n");
            await artifact.set("eval", "input", evalInput);
            await artifact.set("eval", "memory", memory);
            console.log("Uploaded eval artifacts (" + evalInput.length + " bytes)");

  eval:
    name: CI evaluation + consensus
    needs: [prep, repo-shape]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    concurrency:
      group: ci-meta-consensus-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: sw2m/octoscript/action@main

      - name: Build prompt
        env:
          REPO_KIND: ${{ needs.repo-shape.outputs.repo-kind }}
          HAS_TESTS: ${{ needs.repo-shape.outputs.has-tests }}
        run: |
          const evalInput = await artifact.get("eval", "input");
          if (!evalInput) { core.setFailed("eval/input artifact missing"); exit(1); }
          const promptTmpl = await Deno.readTextFile("./.github/scripts/vsdd/ci-meta/prompt.mustache");
          const prompt = Mustache.render(promptTmpl, {
            repoKind: Deno.env.get("REPO_KIND") || "unknown",
            hasTests: Deno.env.get("HAS_TESTS") || "false",
          });
          const input = prompt + "\n\n" + evalInput;
          await shared.set("eval.gemini", "prompt", input);
          await shared.set("eval.claude", "prompt", input);
        shell: octoscript {0}

      - name: Run panel
        id: panel
        uses: sw2m/ci-agents/panel@main
        env:
          INPUT_NAMESPACE: eval
          INPUT_CONFIG: .github/ci-agents/ci-meta.yml
          INPUT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_ORG: sw2m
          INPUT_DEBUG: "true"

      - name: Process consensus + dedup + open gap issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          ruling_raw = subprocess.run(
              ['bash', '-c', 'cat ${GITHUB_SHARED_DIR:-${RUNNER_TEMP:-/tmp}/shared}/eval/ruling'],
              capture_output=True, text=True
          ).stdout.strip()

          if not ruling_raw:
              print("::error::No ruling from panel")
              sys.exit(1)

          ruling = json.loads(ruling_raw)
          print(f"ruling keys: {list(ruling.keys())}")
          categories = ruling.get('categories', {})
          print(f"categories: {list(categories.keys())}")
          for name, cat in categories.items():
              print(f"  {name}: outputs={len(cat.get('outputs', []))}, alignment={cat.get('alignment')}")

          def extract_output(cat_data):
              outputs = cat_data.get('outputs', [])
              if not outputs:
                  return {}
              first = outputs[0]
              return first.get('output') or {}

          gemini_output = extract_output(categories.get('gemini') or {})
          claude_output = extract_output(categories.get('claude') or {})

          gemini_verdict = gemini_output.get('verdict', 'unknown')
          claude_verdict = claude_output.get('verdict', 'unknown')

          if gemini_verdict == 'unknown':
              print("::error::Gemini produced no usable verdict. Output:", json.dumps(gemini_output)[:500])
          if claude_verdict == 'unknown':
              print("::error::Claude produced no usable verdict. Output:", json.dumps(claude_output)[:500])

          fail = gemini_verdict != 'pass' or claude_verdict != 'pass'

          print(f"gemini: verdict={gemini_verdict}, gaps={len(gemini_output.get('gaps', []))}")
          print(f"claude: verdict={claude_verdict}, gaps={len(claude_output.get('gaps', []))}")

          # Merge gap lists
          all_gaps = []
          for g in gemini_output.get('gaps', []):
              all_gaps.append({**g, 'flagged_by': ['gemini']})
          for g in claude_output.get('gaps', []):
              norm = re.sub(r'\W+', ' ', g['title'].lower()).strip()
              merged = False
              for existing in all_gaps:
                  if re.sub(r'\W+', ' ', existing['title'].lower()).strip() == norm:
                      existing['flagged_by'].append('claude')
                      merged = True
                      break
              if not merged:
                  all_gaps.append({**g, 'flagged_by': ['claude']})

          # Fetch existing ci-meta issues for dedup
          candidates = []
          if all_gaps:
              r = subprocess.run(
                  ['gh', 'issue', 'list', '--state', 'all', '--label', 'ci-meta',
                   '--limit', '200', '--json', 'number,title,body,state,stateReason'],
                  capture_output=True, text=True, check=True,
              )
              candidates = json.loads(r.stdout)

          # Title-exact dedup fallback
          duplicate_map = {}
          for i, p in enumerate(all_gaps):
              r = subprocess.run(
                  ['gh', 'issue', 'list', '--state', 'open', '--search', p['title'],
                   '--json', 'number,title'],
                  capture_output=True, text=True, check=True,
              )
              for item in json.loads(r.stdout):
                  if item['title'] == p['title']:
                      duplicate_map[i] = item['number']
                      break

          pr_url = os.environ.get('PR_URL', '')
          opened = []
          for i, g in enumerate(all_gaps):
              if i in duplicate_map:
                  print(f"  skip (dup of #{duplicate_map[i]}): {g['title']}")
                  opened.append(None)
                  continue
              flagged_by = ' + '.join(sorted(g['flagged_by']))
              body = (
                  f"_Flagged by **{flagged_by}** in the VSDD CI meta-review._\n\n"
                  f"{g['body']}\n\n---\n"
                  f"PR triggering this evaluation: {pr_url or '(self-evaluation)'}\n"
              )
              r = subprocess.run(
                  ['gh', 'issue', 'create', '--title', g['title'], '--body', body,
                   '--label', 'ci-meta', '--label', 'spec:goal'],
                  capture_output=True, text=True,
              )
              if r.returncode != 0:
                  r = subprocess.run(
                      ['gh', 'issue', 'create', '--title', g['title'], '--body', body],
                      capture_output=True, text=True, check=True,
                  )
              url = r.stdout.strip().splitlines()[-1]
              print(f"  opened: {url}")
              opened.append(url)

          # Write state for the review posting step
          state = {
              'verdict': 'fail' if fail else 'pass',
              'gemini_verdict': gemini_verdict,
              'claude_verdict': claude_verdict,
              'gemini_rationale': gemini_output.get('rationale', ''),
              'claude_rationale': claude_output.get('rationale', ''),
              'gaps': all_gaps,
              'opened_issue_urls': [u for u in opened if u],
              'duplicate_map': {str(k): v for k, v in duplicate_map.items()},
          }
          with open('consensus-state.json', 'w') as f:
              json.dump(state, f, indent=2)

          opened_count = sum(1 for u in opened if u)
          skipped_count = len(duplicate_map)
          rc = 1 if (fail or opened_count > 0) else 0
          status = 'FAIL' if rc != 0 else 'PASS'
          print(f"\n{status}: {opened_count} gap issue(s) opened, {skipped_count} skipped as duplicates.")
          sys.exit(rc)
          PY

      - name: Submit consensus PR review
        if: always() && hashFiles('consensus-state.json') != '' && github.event_name == 'pull_request'
        run: |
          const state = JSON.parse(await Deno.readTextFile("consensus-state.json"));
          const event = state.verdict === "pass" ? "APPROVE" : "REQUEST_CHANGES";
          const lines = [
            "**VSDD CI Meta-Review** _(advisory; status check is what gates merge)_  ",
            "_Consensus: `" + state.verdict + "` · Gemini: `" + state.gemini_verdict + "` · Claude: `" + state.claude_verdict + "`_",
            "",
            "**Gemini rationale.** " + state.gemini_rationale,
            "",
            "**Claude rationale.** " + state.claude_rationale,
            "",
          ];
          if (state.gaps.length > 0) {
            lines.push("### Gaps (" + state.gaps.length + ")", "");
            for (let i = 0; i < state.gaps.length; i++) {
              const g = state.gaps[i];
              const flagged = (g.flagged_by || []).sort().join(" + ");
              const url = state.opened_issue_urls[i];
              lines.push("- " + g.title + " _(flagged by " + flagged + ")_" + (url ? " — " + url : ""));
            }
            lines.push("");
          }
          lines.push("---", "_Automated meta-review per MEMORY.md §I (Adversary)._");

          const author = context.payload.pull_request?.user?.login;
          if (author === "github-actions[bot]") {
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: lines.join("\n"),
            });
          } else {
            await github.rest.pulls.createReview({
              ...context.repo, pull_number: context.issue.number,
              event, body: lines.join("\n"),
            });
          }
        shell: octoscript {0}

name: VSDD Issue Review (Phase 1c)

# Advisory adversarial review of new/edited issues. Two adversarial reviewers
# run in parallel for cognitive diversity (MEMORY.md §V): Gemini and Claude.
# Each posts its findings as an issue comment. Org membership is enforced
# inside the composite actions — non-members trigger a hard fail of the agent
# step.

on:
  issues:
    # `assigned` so externally-authored or bot-authored issues become
    # eligible for Phase 1c review when an org member self-assigns.
    types: [opened, edited, assigned]
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  issues: write
  contents: read

jobs:
  ownership:
    name: Verify org-member ownership
    runs-on: ubuntu-latest
    outputs:
      owned: ${{ steps.check.outputs.owned }}
      owner: ${{ steps.check.outputs.owner }}
      has-gemini-key: ${{ steps.keys.outputs.has-gemini-key }}
      has-anthropic-key: ${{ steps.keys.outputs.has-anthropic-key }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: sw2m
          AUTHOR: ${{ github.event.issue.user.login }}
          ASSIGNEES_JSON: ${{ toJson(github.event.issue.assignees) }}
        shell: bash
        run: |
          set -euo pipefail
          check_member() {
            local login="$1"
            [ -n "$login" ] && gh api "orgs/$ORG/members/$login" >/dev/null 2>&1
          }
          OWNER=""
          if check_member "$AUTHOR"; then
            OWNER="$AUTHOR"
            echo "Owner: $AUTHOR (issue author, org member)"
          else
            for login in $(jq -r '.[].login' <<< "$ASSIGNEES_JSON"); do
              if check_member "$login"; then
                OWNER="$login"
                echo "Owner: $login (assignee, org member)"
                break
              fi
            done
          fi
          if [ -n "$OWNER" ]; then
            echo "owned=true"  >> "$GITHUB_OUTPUT"
            echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          else
            echo "owned=false" >> "$GITHUB_OUTPUT"
            echo "owner="      >> "$GITHUB_OUTPUT"
            echo "::notice::Issue not owned: author '$AUTHOR' is not an sw2m org member and no assignee is. Phase 1c review skipped. To enable, an org member must self-assign."
          fi
      - id: keys
        # `secrets` is allowed in step env but NOT in job-level `if:`. Surface
        # presence as a job output so reviewer jobs can gate via `needs.*`.
        # (See pr-review.yml for the registration-failure history that
        # forced this restructuring.)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          [ -n "${GEMINI_API_KEY:-}" ]    && echo "has-gemini-key=true"    >> "$GITHUB_OUTPUT" || echo "has-gemini-key=false"    >> "$GITHUB_OUTPUT"
          [ -n "${ANTHROPIC_API_KEY:-}" ] && echo "has-anthropic-key=true" >> "$GITHUB_OUTPUT" || echo "has-anthropic-key=false" >> "$GITHUB_OUTPUT"

  prep:
    name: Build Phase 1c prompt
    needs: [ownership]
    if: ${{ needs.ownership.outputs.owned == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Fetch philosophies for the canonical MEMORY.md fallback when the
      # consumer doesn't have one of their own.
      - name: Fetch sw2m/philosophies (canonical MEMORY.md)
        uses: actions/checkout@v6
        with:
          repository: sw2m/philosophies
          ref: main
          path: .vsdd-philosophies

      - name: Detect spec:goal label
        id: label-check
        env:
          LABELS_JSON: ${{ toJSON(github.event.issue.labels) }}
        shell: bash
        run: |
          set -euo pipefail
          # `is-goal-spec=true` only when the issue carries the spec:goal
          # label. Per #128: the cardinality counting directive is injected
          # only for goal-specs; tech-spec reviews are unaffected.
          is_goal=$(jq -r 'any(.name == "spec:goal")' <<<"$LABELS_JSON")
          echo "is-goal-spec=$is_goal" >> "$GITHUB_OUTPUT"

      - uses: sw2m/octoscript/action@main

      - name: Build prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IS_GOAL_SPEC: ${{ steps.label-check.outputs.is-goal-spec }}
        uses: sw2m/octoscript@main
        with:
          script: |
            const memoryPath = await Deno.stat("MEMORY.md").then(() => "MEMORY.md").catch(() => ".vsdd-philosophies/MEMORY.md");
            const memory = await Deno.readTextFile(memoryPath);
            const promptTmpl = await Deno.readTextFile("./.github/scripts/vsdd/phase-1c/prompt.mustache");
            const isGoal = Deno.env.get("IS_GOAL_SPEC") === "true";
            const cardinalityTmpl = isGoal
              ? await Deno.readTextFile("./.github/scripts/vsdd/phase-1c/cardinality.mustache")
              : "";
            const prompt = Mustache.render(promptTmpl, {
              memory,
              cardinality: cardinalityTmpl,
              title: Deno.env.get("ISSUE_TITLE") ?? "",
              body: Deno.env.get("ISSUE_BODY") ?? "",
            });
            await artifact.set("prep", "prompt", prompt);
            console.log("Uploaded prep/prompt artifact");


  review:
    name: Phase 1c adversarial review
    needs: [ownership, prep]
    if: ${{ needs.ownership.outputs.owned == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: sw2m/octoscript/action@main

      - name: Load prompt
        run: |
          const prompt = await artifact.get("prep", "prompt");
          if (!prompt) { core.setFailed("prep/prompt artifact missing"); exit(1); }
          await shared.set("review.gemini", "prompt", prompt);
          await shared.set("review.claude", "prompt", prompt);
        shell: octoscript {0}

      - name: Compute review round
        id: round
        run: |
          const budgetMod = await import("./.github/scripts/vsdd/budget.ts");
          const budget = new budgetMod.Budget({ key: "phase-1c" });
          const allComments = await github.paginate(
            github.rest.issues.listComments,
            { ...context.repo, issue_number: context.issue.number, per_page: 100 },
          );
          const gemRound = budget.round(allComments, "gemini");
          const claRound = budget.round(allComments, "claude");
          const round = Math.max(gemRound, claRound);
          await output.set("round", String(round));
          console.log("Review round: " + round + " (gemini=" + gemRound + ", claude=" + claRound + ")");
        shell: octoscript {0}

      - name: Run panel
        id: panel
        uses: sw2m/ci-agents/panel@main
        with:
          namespace: review
          config: .github/ci-agents/issue-review.yml
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          org: sw2m
          actor: ${{ needs.ownership.outputs.owner }}
          round: ${{ steps.round.outputs.round }}

      - name: Post reviews + orchestrate cardinality
        run: |
          const budgetMod = await import("./.github/scripts/vsdd/budget.ts");
          const cardinality = await import("./.github/scripts/vsdd/promote/to-tech/cardinality.ts");

          const rulingJson = await shared.get("review", "ruling");
          if (!rulingJson) { core.setFailed("No ruling from panel"); exit(1); }
          const ruling = JSON.parse(rulingJson);

          const allComments = await github.paginate(
          github.rest.issues.listComments,
          { ...context.repo, issue_number: context.issue.number, per_page: 100 },
          );

          const issueLabels = (context.payload.issue?.labels || [])
          .map((l) => typeof l === "string" ? l : l.name);
          const isGoal = issueLabels.includes("spec:goal");

          // Post each reviewer's output as a comment
          for (const [slug, cat] of Object.entries(ruling.categories)) {
          const agentOutput = cat.outputs?.[0];
          if (!agentOutput?.output) continue;
          const result = agentOutput.output;

          const budget = new budgetMod.Budget({ key: "phase-1c" });
          const round = budget.round(allComments, slug);
          const cap = budget.budget(round);

          // Build review body from structured concerns
          const concerns = result.concerns || [];
          const bullets = concerns.map((c) => {
            const sev = c.severity === "blocking" ? "(blocking) " : "";
            return "- " + sev + c.text;
          }).join("\n");
          const reviewBody = bullets || "No Phase 1c concerns identified.";

          const processed = budget.process({ body: reviewBody, round, budget: cap });

          // Build frontmatter for the comment
          const fm = serde.dump({
            vsdd: {
              "phase-1c": {
                reviewer: slug,
                verdict: processed.verdict,
                ...(isGoal && result.subjects !== undefined ? { subjects: result.subjects, outcomes: result.outcomes } : {}),
              }
            }
          }, "frontmatter");

          const label = slug.charAt(0).toUpperCase() + slug.slice(1);
          const header = "**VSDD Phase 1c — " + label + "**\n\n";
          const footer = "\n\n---\n_Automated review per MEMORY.md §II Phase 1c. Verdict gates promotion._";

          await github.rest.issues.createComment({
            ...context.repo, issue_number: context.issue.number,
            body: fm + "\n" + header + processed.body + footer,
          });
          }

          // Cardinality orchestrator (goal-specs only)
          if (isGoal) {
          const gemResult = ruling.categories.gemini?.outputs?.[0]?.output;
          const claResult = ruling.categories.claude?.outputs?.[0]?.output;

          const concerns = [];
          let canonical = null;

          const gTuple = gemResult?.subjects !== undefined ? { subjects: gemResult.subjects, outcomes: gemResult.outcomes } : null;
          const cTuple = claResult?.subjects !== undefined ? { subjects: claResult.subjects, outcomes: claResult.outcomes } : null;

          if (!gTuple) concerns.push("(blocking) Gemini missing subjects/outcomes counts.");
          if (!cTuple) concerns.push("(blocking) Claude missing subjects/outcomes counts.");

          if (gTuple && cTuple) {
            const g = cardinality.classify(gTuple);
            const c = cardinality.classify(cTuple);
            if (g.single !== c.single) {
              concerns.push(
                "(blocking) Reviewers disagree on classification: " +
                "gemini=" + JSON.stringify(gTuple) + " (" + (g.single ? "atomic" : "decomposable") + "); " +
                "claude=" + JSON.stringify(cTuple) + " (" + (c.single ? "atomic" : "decomposable") + ")."
              );
            } else {
              canonical = cardinality.combine(gTuple, cTuple);
            }
          }

          const orchVerdict = concerns.length === 0 ? "pass" : "fail";
          const fm = cardinality.emit({ verdict: orchVerdict, ...(canonical || {}) });
          const orchHeader = "**VSDD Phase 1c — Orchestrator (cardinality)**\n\n";
          const orchBody = concerns.length === 0
            ? "Reviewer counts agreed. Canonical tuple: subjects=" + canonical.subjects + ", outcomes=" + canonical.outcomes + "."
            : concerns.map((x) => "- " + x).join("\n");
          const orchFooter = "\n\n---\n_Per #128: cardinality orchestrator._";

          await github.rest.issues.createComment({
            ...context.repo, issue_number: context.issue.number,
            body: fm + "\n\n" + orchHeader + orchBody + orchFooter,
          });
          }
        shell: octoscript {0}
